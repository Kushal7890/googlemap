<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Clicker Extension</title>
  <style>
    body {
      width: 300px;
      min-height: 200px;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      margin: 0;
    }

    .container {
      text-align: center;
    }

    h1 {
      font-size: 18px;
      margin-bottom: 20px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .status {
      margin: 15px 0;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .status.active {
      background-color: rgba(76, 175, 80, 0.3);
      border: 2px solid #4CAF50;
    }

    .status.inactive {
      background-color: rgba(244, 67, 54, 0.3);
      border: 2px solid #f44336;
    }

    button {
      background: linear-gradient(45deg, #FF6B6B, #4ECDC4);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      margin: 10px 0;
      width: 100%;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }

    button:active {
      transform: translateY(0);
    }

    .settings {
      margin-top: 20px;
      padding: 15px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      backdrop-filter: blur(10px);
    }

    .setting-item {
      margin: 10px 0;
      text-align: left;
    }

    .setting-item label {
      display: block;
      font-size: 12px;
      margin-bottom: 5px;
      opacity: 0.9;
    }

    .setting-item input[type="range"] {
      width: 100%;
      margin: 5px 0;
    }

    .setting-item input[type="number"] {
      width: 60px;
      padding: 5px;
      border: none;
      border-radius: 5px;
      background: rgba(255,255,255,0.2);
      color: white;
      text-align: center;
    }

    .info {
      margin-top: 15px;
      font-size: 12px;
      opacity: 0.8;
      line-height: 1.4;
    }

    .icon {
      font-size: 24px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🎯</div>
    <h1>Word Clicker Extension</h1>
    
    <div id="status" class="status inactive">
      Status: Inactive
    </div>
    
    <button id="toggleBtn">Start Clicking</button>
    
    <div class="settings">
      <h3 style="margin-top: 0; font-size: 14px;">Settings</h3>
      
      <div class="setting-item">
        <label for="clickSpeed">Click Speed (seconds):</label>
        <input type="range" id="clickSpeed" min="0.1" max="5" step="0.1" value="1">
        <input type="number" id="clickSpeedValue" min="0.1" max="5" step="0.1" value="1">
      </div>
      
      <div class="setting-item">
        <label for="detectionSpeed">Detection Refresh (ms):</label>
        <input type="range" id="detectionSpeed" min="1" max="1000" step="1" value="1">
        <input type="number" id="detectionSpeedValue" min="1" max="1000" step="1" value="1">
      </div>
    </div>
    
    <div class="info">
      <strong>How it works:</strong><br>
      • Detects all words on the page<br>
      • Clicks words in cyclic order<br>
      • Updates in real-time for dynamic content<br>
      • Use settings to adjust timing
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
